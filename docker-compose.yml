version: '3.8'

services:
  defect-detection:
    image: flappy10/defect-detection-dl:v1
    container_name: defect-detection-app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://localhost:8000/predict
    volumes:
      - ./models/registry:/app/models/registry
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
