version: '3.8'

services:
  defect-detection:
    build: .
    image: flappy10/defect-detection-dl:latest
    container_name: defect-detection-app

    ports:
      - "8000:8000"
      - "8501:8501"

    environment:
      PYTHONUNBUFFERED: 1
      DEVICE: cpu
      BACKEND_URL: http://127.0.0.1:8000/predict

    volumes:
      - ./models/registry:/app/models/registry
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s